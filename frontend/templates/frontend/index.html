
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know Your District</title>
    <link rel="stylesheet" href="{% static 'frontend/css/styles.css' %}">
</head>
<body>

    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Know Your District</h2>

            <button type="button" id="new-chat-button">
                + New Chat
            </button>

            <h3>History</h3>
            <div id="history">
                <!-- Chat history will go here -->
            </div>
        </aside>

        <!-- Main Chat Section -->
        <main class="main-content">

            <header>
                <h1>ʻIke — Your District Assistant</h1>

                <div class="accessibility-menu">
                    <button
                        type="button"
                        id="accessibility-button"
                        aria-expanded="false"
                        aria-controls="accessibility-panel">
                        Accessibility
                    </button>

                    <div
                        id="accessibility-panel"
                        class="accessibility-panel"
                        role="group"
                        aria-label="Accessibility settings"
                        hidden>

                        <fieldset>
                            <legend>Text size</legend>

                            <label>
                                <input
                                    type="radio"
                                    name="font-size"
                                    value="small">
                                Small
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="font-size"
                                    value="medium"
                                    checked>
                                Medium
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="font-size"
                                    value="large">
                                Large
                            </label>
                        </fieldset>

                        <label class="toggle-row">
                            <input
                                type="checkbox"
                                id="colorblind-toggle">
                            Colorblind mode
                        </label>
                    </div>
                </div>
            </header>

            <!-- Chat Messages -->
            <section
                class="chat-area"
                id="chat-messages"
                aria-live="polite">
            </section>

            <!-- Message Input -->
            <div class="prompt-area">
                <textarea
                    id="chat-input"
                    placeholder="Ask about your district..."></textarea>

                <button type="button" id="send-button">
                    Send
                </button>
            </div>

        </main>

    </div>

    <!-- Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked@16.4.1/lib/marked.umd.js"></script>

    <!-- HTML sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <!-- Chatbot JavaScript -->
    <script src="{% static 'frontend/js/chat.js' %}"></script>

</body>
</html>
